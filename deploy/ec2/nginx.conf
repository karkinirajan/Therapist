# Nginx site config: terminates TLS and reverse-proxies everything to the
# Next.js container (docker-compose.yml's `web` service, port 3000). The
# FastAPI backend is not exposed here for regular HTTP traffic - it's called
# server-side, by Next.js's own route handlers (apps/web/lib/auth-proxy.ts)
# on the same box via API_BASE_URL. The one exception is /voice/ws below: a
# WebSocket connection has to reach FastAPI directly (Next.js Route Handlers
# don't proxy WS upgrades), so that one location routes straight to the api
# container's loopback-published port (see docker-compose.prod.yml) instead
# of through Next. Security headers (CSP, HSTS, etc.) are already set
# application-side in apps/web/next.config.ts - this file doesn't duplicate
# them.
#
# Install:
#   sudo cp deploy/ec2/ssl/therapist.crt /etc/nginx/ssl/
#   sudo cp deploy/ec2/ssl/therapist.key /etc/nginx/ssl/
#   sudo cp deploy/ec2/nginx.conf /etc/nginx/sites-available/therapist
#   sudo ln -s /etc/nginx/sites-available/therapist /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# (Since you are using a Cloudflare Origin Certificate, you no longer need Certbot.)

server {
    listen 80;
    listen [::]:80;
    server_name therapist.kneeraazon.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name therapist.kneeraazon.com;

    ssl_certificate /etc/nginx/ssl/therapist.crt;
    ssl_certificate_key /etc/nginx/ssl/therapist.key;
    
    # Cloudflare Authenticated Origin Pulls (optional but recommended if using Cloudflare Origin CA)
    # ssl_client_certificate /etc/nginx/ssl/cloudflare.crt;
    # ssl_verify_client on;

    # Basic SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev-mode HMR uses WebSockets; harmless to keep enabled in
        # production too and avoids a class of "works in dev, breaks behind
        # Nginx" surprises if any future feature needs an upgrade connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Voice therapy feature's live conversation socket - routed directly to
    # FastAPI (api service, published to 127.0.0.1:8000 in
    # docker-compose.prod.yml), not through Next.js. A voice conversation
    # can run for a while, so this gets a much longer read timeout than the
    # default "/" location above.
    location /voice/ws {
        # Socket tickets are necessarily query parameters during the WS
        # handshake. Do not retain even their short-lived values in access logs.
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }

    client_max_body_size 4m;
}
