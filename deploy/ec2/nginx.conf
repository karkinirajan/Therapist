# Nginx site config: terminates TLS and reverse-proxies everything to the
# Next.js process (PM2, port 3000). The FastAPI backend is NOT exposed here
# on purpose - it's only ever called server-side, by Next.js's own route
# handlers (apps/web/lib/auth-proxy.ts) on the same box via API_BASE_URL, so
# there's nothing for Nginx to route to it. Security headers (CSP, HSTS,
# etc.) are already set application-side in apps/web/next.config.ts - this
# file doesn't duplicate them.
#
# Install:
#   sudo cp deploy/ec2/nginx.conf /etc/nginx/sites-available/therapist
#   sudo ln -s /etc/nginx/sites-available/therapist /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.yourdomain.com   # provisions TLS, rewrites this file's server block
#
# Replace app.yourdomain.com below before installing.

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev-mode HMR uses WebSockets; harmless to keep enabled in
        # production too and avoids a class of "works in dev, breaks behind
        # Nginx" surprises if any future feature needs an upgrade connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    client_max_body_size 4m;
}
