services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: therapist
      POSTGRES_PASSWORD: therapist
      POSTGRES_DB: therapist
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapist -d therapist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
