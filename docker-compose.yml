# Local development only. Values come from a root .env (see .env.example) so
# no real credential lives in this file; the fallback defaults below are for
# a laptop-only Postgres instance and must never be reused anywhere else.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-therapist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-therapist_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-therapist}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-therapist} -d ${POSTGRES_DB:-therapist}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
